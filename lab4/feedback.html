<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Форма обратной связи с кофейней Тёплый угол.">
    <title>Обратная связь — Тёплый угол</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/feedback.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">Тёплый <span class="logo__accent">угол</span></a>
      <nav class="nav" aria-label="Основная навигация">
        <ul class="nav__list">
          <li><a class="nav__link" href="index.html">Главная</a></li>
          <li><a class="nav__link" href="menu.html">Меню</a></li>
          <li><a class="nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </header>

    <main class="page-content">
      <section class="feedback" aria-labelledby="feedback-title">
        <h1 id="feedback-title">Обратная связь</h1>
        <p>Оставьте имя и почту для обратной связи.</p>
        <form class="feedback__form" id="feedback-form">
          <label class="feedback__field" for="name">Имя
            <input class="feedback__input" id="name" name="name" type="text" autocomplete="name" required>
          </label>
          <label class="feedback__field" for="email">Электронная почта
            <input class="feedback__input" id="email" name="email" type="email" autocomplete="email" required>
          </label>
          <label class="feedback__consent" for="consent">
            <input class="feedback__checkbox" id="consent" name="consent" type="checkbox" required>
            Согласен на обработку введённых данных
          </label>
          <button class="button" type="submit">Отправить</button>
          <p class="feedback__status" id="feedback-status" role="status"></p>
        </form>
      </section>

      <p><a class="text-link" href="contacts.html">Вернуться к контактам</a></p>
    </main>

    <footer class="site-footer"><p>© 2026 «Тёплый угол»</p><p>Кофе, который согревает.</p></footer>
  </body>
</html>
